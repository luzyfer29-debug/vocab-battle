<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocab Battle – Diagnose</title><style>body{font:17px system-ui;background:#161329;color:white;padding:18px;line-height:1.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#29243f;padding:14px;border-radius:12px}h1{font-size:24px}.ok{color:#91f4a0}.bad{color:#ff9f9f}</style></head><body><h1>🔍 Vocab Battle – Fehlerprüfung</h1><p>Diese Seite prüft nur Dateien. Sie löscht und verändert keine Lernstände.</p><pre id="out">Prüfung startet …</pre><script type="module">
const out=document.getElementById('out');let lines=[];function log(t){lines.push(t);out.textContent=lines.join('\n');}
const stamp=Date.now();
const items=[['Firebase-Konfiguration','firebase-config.js'],['Englisch-Fragen','questions.js'],['Mathe-Fragen','math-questions.js'],['Grammatik-Fragen','grammar-data.js'],['Firebase-App-SDK','https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js'],['Firebase-Auth-SDK','https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js'],['Firebase-Datenbank-SDK','https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js'],['Hauptprogramm','app.js']];
for(const [name,path] of items){const url=new URL(path,location.href);url.searchParams.set('diagnose',stamp);try{const r=await fetch(url,{cache:'no-store'});const src=await r.text();if(!r.ok){log('❌ '+name+': HTTP '+r.status);continue;}log('📄 '+name+': '+src.length+' Zeichen; Ende: '+JSON.stringify(src.slice(-95)));try{await import(url.href);log('✅ '+name+': Import erfolgreich');}catch(e){log('❌ '+name+': '+String(e?.name||'Fehler')+' – '+String(e?.message||e));log(String(e?.stack||''));}}catch(e){log('❌ '+name+': Abruf fehlgeschlagen – '+e.message);}}
log('\nFertig. Bitte diese Ergebnisse an ChatGPT schicken.');
</script></body></html>
